name: Snow playback preview
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-snow-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build opted-in Snow preview without vendor resources
        env:
          VTR_SNOW_TEST_BUILD: '1'
        run: |
          test "$(uname -m)" = arm64
          test ! -d analysis
          brew install cmake ninja
          bash tools/build_beta.sh
      - name: Validate preview AU registration
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto "native/vst3/build-beta/AU/Virus TI Rework.component" "$HOME/Library/Audio/Plug-Ins/Components/Virus TI Rework.component"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu VtRw GmAS -strict -qp > native/vst3/build-beta/auval.log 2>&1 || { cat native/vst3/build-beta/auval.log; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Virus-TI-Rework-Snow-Test-macOS-arm64
          path: |
            dist/Virus-TI-Rework-0.2.0-snow-test.1-macOS-arm64.zip
            dist/SHA256SUMS.txt
            native/vst3/build-beta/validator.log
            native/vst3/build-beta/auval.log
          if-no-files-found: error
